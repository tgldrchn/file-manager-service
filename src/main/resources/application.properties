# Supabase config - утгуудыг Render Environment Variables-д нэмнэ
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET:soa-files}

# SOAP service URL (token validation)
soap.service.url=${SOAP_SERVICE_URL}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Port
server.port=8080
